<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TEEN MONSTER</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#100b18;color:#f8f4ff;font-family:tahoma,Arial,sans-serif}
    header{padding:24px;text-align:center;background:#241333;border-bottom:1px solid #6f398e}
    h1{color:#dca5ff;margin:0}
    main{width:min(850px,92%);margin:25px auto}
    .panel{background:#1d1428;border:1px solid #49315d;border-radius:16px;padding:20px;margin-bottom:20px}
    input,textarea{width:100%;padding:12px;margin:8px 0;background:#100b18;color:white;border:1px solid #644477;border-radius:9px;font:inherit}
    button{padding:11px 16px;border:0;border-radius:9px;background:#a84ee8;color:white;font:inherit;cursor:pointer;margin:4px}
    button:hover{filter:brightness(1.12)}
    .secondary{background:#49315d}
    .danger{background:#a83255}
    .hidden{display:none!important}
    .news-item{padding:15px 0;border-bottom:1px solid #49315d}
    .news-item:last-child{border-bottom:0}
    .muted{color:#c7b5d4;font-size:13px}
    .status{white-space:pre-wrap;color:#e2c5ff}
    .row{display:flex;gap:8px;flex-wrap:wrap}
  </style>
</head>
<body>
<header>
  <h1>👾 TEEN MONSTER</h1>
  <p>دنیای ما، قوانین ما</p>
</header>
<main>
  <section class="panel">
    <h2>👤 حساب کاربری</h2>
    <form id="authForm">
      <input id="email" type="email" placeholder="ایمیل" autocomplete="email" required>
      <input id="password" type="password" placeholder="رمز عبور (حداقل ۶ کاراکتر)" minlength="6" autocomplete="current-password" required>
      <div class="row">
        <button type="submit" id="loginBtn">ورود</button>
        <button type="button" id="signupBtn" class="secondary">ثبت‌نام</button>
        <button type="button" id="logoutBtn" class="secondary hidden">خروج</button>
      </div>
    </form>
    <p id="authStatus" class="status" role="status" aria-live="polite"></p>
    <p id="userInfo" class="muted"></p>
  </section>
  <section class="panel" id="news">
    <h2>📰 اخبار TEEN MONSTER</h2>
    <p class="muted">آخرین خبرها و اطلاعیه‌های گروه</p>
    <button id="showEditorBtn" class="hidden">＋ نوشتن خبر</button>
    <form id="newsForm" class="hidden">
      <input id="newsTitle" maxlength="160" placeholder="عنوان خبر" required>
      <textarea id="newsContent" maxlength="12000" rows="5" placeholder="متن خبر..." required></textarea>
      <div class="row">
        <button type="submit" id="saveNewsBtn">انتشار خبر</button>
        <button type="button" id="cancelNewsBtn" class="secondary">انصراف</button>
      </div>
    </form>
    <p id="newsStatus" class="status" role="status" aria-live="polite"></p>
    <div id="newsList">در حال دریافت اخبار...</div>
  </section>
</main>
<script>
(() => {
  const SUPABASE_URL = "https://tttffiyxqxphixryjavq.supabase.co";
  const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_WetuCjAtn1DCom1pOF3SKw_fxMbJdr_";
  const $ = id => document.getElementById(id);
  const authStatus = $("authStatus");
  const newsStatus = $("newsStatus");
  if (
  !window.supabase ||
  !SUPABASE_PUBLISHABLE_KEY ||
  SUPABASE_PUBLISHABLE_KEY === "sb_publishable_WetuCjAtn1DCom1pOF3SKw_fxMbJdr_"
) {
  authStatus.textContent = "اتصال Supabase برقرار نیست؛ کلید عمومی را بررسی کن.";
  newsStatus.textContent = "اتصال Supabase هنوز تنظیم نشده است.";
  $("newsList").textContent = "";
  return;
}
  const db = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );
  let currentUser = null;
  let isVerifiedAdmin = false;
  let editingNewsId = null;
  function setStatus(element, message) {
    element.textContent = message || "";
  }
  function show(element, visible) {
    element.classList.toggle("hidden", !visible);
  }
  async function verifyAdmin() {
    if (!currentUser) return false;
    const { data, error } = await db
      .from("user_roles")
      .select("role")
      .eq("user_id", currentUser.id)
      .maybeSingle();
    if (error) {
      console.error("Admin verification error:", error.message);
      return false;
    }
    return data?.role === "admin";
  }
  async function refreshSession() {
    const { data, error } = await db.auth.getUser();
    currentUser = error ? null : data.user;
    isVerifiedAdmin = await verifyAdmin();
    $("userInfo").textContent = currentUser
      ? "وارد شده‌اید: " + currentUser.email
      : "برای انتشار خبر یا مدیریت حساب وارد شوید.";
    show($("logoutBtn"), !!currentUser);
    show($("showEditorBtn"), isVerifiedAdmin);
    if (!isVerifiedAdmin) {
      show($("newsForm"), false);
      editingNewsId = null;
    }
    await loadNews();
  }
  $("authForm").addEventListener("submit", async event => {
    event.preventDefault();
    setStatus(authStatus, "در حال ورود...");
    const email = $("email").value.trim();
    const password = $("password").value;
    const { error } = await db.auth.signInWithPassword({ email, password });
    if (error) {
      setStatus(authStatus, "ورود ناموفق بود: " + error.message);
      return;
    }
    setStatus(authStatus, "ورود موفق بود.");
    await refreshSession();
  });
  $("signupBtn").addEventListener("click", async () => {
    setStatus(authStatus, "در حال ثبت‌نام...");
    const email = $("email").value.trim();
    const password = $("password").value;
    if (!email || password.length < 6) {
      setStatus(authStatus, "ایمیل معتبر و رمز عبور حداقل ۶ کاراکتری وارد کن.");
      return;
    }
    const { data, error } = await db.auth.signUp({
      email,
      password,
      options: {
        emailRedirectTo: window.location.origin
      }
    });
    if (error) {
      setStatus(authStatus, "ثبت‌نام ناموفق بود: " + error.message);
      return;
    }
    setStatus(
      authStatus,
      data.session
        ? "ثبت‌نام موفق بود؛ اکنون می‌توانی از سایت استفاده کنی."
        : "ثبت‌نام انجام شد. اگر تأیید ایمیل فعال است، ایمیلت را بررسی کن."
    );
    await refreshSession();
  });
  $("logoutBtn").addEventListener("click", async () => {
    const { error } = await db.auth.signOut();
    if (error) {
      setStatus(authStatus, "خروج ناموفق بود: " + error.message);
      return;
    }
    setStatus(authStatus, "از حساب خارج شدی.");
    await refreshSession();
  });
  $("showEditorBtn").addEventListener("click", () => {
    if (!isVerifiedAdmin) return;
    editingNewsId = null;
    $("newsTitle").value = "";
    $("newsContent").value = "";
    $("saveNewsBtn").textContent = "انتشار خبر";
    show($("newsForm"), true);
  });
  $("cancelNewsBtn").addEventListener("click", () => {
    show($("newsForm"), false);
    editingNewsId = null;
  });
  $("newsForm").addEventListener("submit", async event => {
    event.preventDefault();
    if (!currentUser || !(await verifyAdmin())) {
      isVerifiedAdmin = false;
      show($("showEditorBtn"), false);
      show($("newsForm"), false);
      setStatus(newsStatus, "اجازه مدیریت اخبار را نداری.");
      return;
    }
    const title = $("newsTitle").value.trim();
    const content = $("newsContent").value.trim();
    if (!title || !content) {
      setStatus(newsStatus, "عنوان و متن خبر را وارد کن.");
      return;
    }
    setStatus(newsStatus, "در حال ذخیره خبر...");
    let result;
    if (editingNewsId) {
      result = await db
        .from("news")
        .update({
          title,
          content,
          updated_at: new Date().toISOString()
        })
        .eq("id", editingNewsId);
    } else {
      result = await db.from("news").insert({
        title,
        content,
        author_id: currentUser.id
      });
    }
    if (result.error) {
      setStatus(newsStatus, "ذخیره انجام نشد: " + result.error.message);
      return;
    }
    setStatus(newsStatus, "خبر با موفقیت ذخیره شد.");
    show($("newsForm"), false);
    editingNewsId = null;
    await loadNews();
  });
  async function loadNews() {
    const { data, error } = await db
      .from("news")
      .select("id, title, content, created_at, author_id")
      .order("created_at", { ascending: false });
    const list = $("newsList");
    list.replaceChildren();
    if (error) {
      list.textContent = "دریافت اخبار ناموفق بود. تنظیمات جدول news را بررسی کن.";
      console.error(error);
      return;
    }
    if (!data || data.length === 0) {
      list.textContent = "هنوز خبری منتشر نشده است.";
      return;
    }
    data.forEach(item => {
      const article = document.createElement("article");
      article.className = "news-item";
      const heading = document.createElement("h3");
      heading.textContent = item.title;
      const body = document.createElement("p");
      body.style.whiteSpace = "pre-wrap";
      body.textContent = item.content;
      const date = document.createElement("p");
      date.className = "muted";
      date.textContent = new Date(item.created_at).toLocaleString("fa-IR");
      article.append(heading, body, date);
      if (isVerifiedAdmin) {
        const editBtn = document.createElement("button");
        editBtn.textContent = "ویرایش";
        editBtn.className = "secondary";
        editBtn.addEventListener("click", () => {
          editingNewsId = item.id;
          $("newsTitle").value = item.title;
          $("newsContent").value = item.content;
          $("saveNewsBtn").textContent = "ذخیره تغییرات";
          show($("newsForm"), true);
          $("newsForm").scrollIntoView({ behavior: "smooth" });
        });
        const deleteBtn = document.createElement("button");
        deleteBtn.textContent = "حذف";
        deleteBtn.className = "danger";
        deleteBtn.addEventListener("click", async () => {
          if (!isVerifiedAdmin || !confirm("این خبر حذف شود؟")) return;
          const { error } = await db
            .from("news")
            .delete()
            .eq("id", item.id);
          if (error) {
            setStatus(newsStatus, "حذف انجام نشد: " + error.message);
            return;
          }
          setStatus(newsStatus, "خبر حذف شد.");
          await loadNews();
        });
        article.append(editBtn, deleteBtn);
      }
      list.append(article);
    });
  }
  db.auth.onAuthStateChange(() => {
    setTimeout(refreshSession, 0);
  });
  refreshSession();
})();
</script>
</body>
</html>
