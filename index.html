<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TEEN MONSTER</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #100b18;
      color: #f8f4ff;
      font-family: Tahoma, Arial, sans-serif;
      line-height: 1.8;
    }
    header {
      padding: 28px 16px;
      text-align: center;
      background: #241333;
      border-bottom: 1px solid #6f398e;
    }
    header h1 {
      color: #dca5ff;
      margin: 0;
      font-size: 30px;
    }
    main {
      width: min(850px, 92%);
      margin: 25px auto;
    }
    .panel {
      background: #1d1428;
      border: 1px solid #49315d;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
    }
    input, textarea {
      display: block;
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      background: #100b18;
      color: white;
      border: 1px solid #644477;
      border-radius: 9px;
      font: inherit;
    }
    textarea {
      resize: vertical;
    }
    button {
      padding: 10px 17px;
      border: 0;
      border-radius: 9px;
      background: #a84ee8;
      color: white;
      font: inherit;
      cursor: pointer;
      margin: 4px;
    }
    button:hover {
      filter: brightness(1.12);
    }
    button:disabled {
      opacity: .6;
      cursor: wait;
    }
    .secondary { background: #49315d; }
    .danger { background: #a83255; }
    .hidden { display: none !important; }
    .status {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      color: #e2c5ff;
    }
    .muted {
      color: #c7b5d4;
      font-size: 13px;
    }
    .news-item {
      padding: 15px 0;
      border-bottom: 1px solid #49315d;
    }
    .news-item:last-child {
      border-bottom: 0;
    }
    .row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
  </style>
</head>
<body>
<header>
  <h1>👾 TEEN MONSTER</h1>
  <p>دنیای ما، قوانین ما</p>
</header>
<main>
  <section class="panel">
    <h2>👤 حساب کاربری</h2>
    <form id="authForm">
      <input
        id="email"
        type="email"
        placeholder="ایمیل"
        autocomplete="email"
        required
      >
      <input
        id="password"
        type="password"
        placeholder="رمز عبور (حداقل ۶ کاراکتر)"
        minlength="6"
        autocomplete="current-password"
        required
      >
      <div class="row">
        <button type="submit" id="loginBtn">ورود</button>
        <button type="button" id="signupBtn" class="secondary">ثبت‌نام</button>
        <button type="button" id="logoutBtn" class="secondary hidden">خروج</button>
      </div>
    </form>
    <p id="authStatus" class="status" role="status" aria-live="polite"></p>
    <p id="userInfo" class="muted"></p>
  </section>
  <section class="panel" id="news">
    <h2>📰 اخبار TEEN MONSTER</h2>
    <p class="muted">آخرین خبرها و اطلاعیه‌های گروه</p>
    <button id="showEditorBtn" class="hidden" type="button">
      ＋ نوشتن خبر
    </button>
    <form id="newsForm" class="hidden">
      <input
        id="newsTitle"
        maxlength="160"
        placeholder="عنوان خبر"
        required
      >
      <textarea
        id="newsContent"
        maxlength="12000"
        rows="5"
        placeholder="متن خبر..."
        required
      ></textarea>
      <div class="row">
        <button type="submit" id="saveNewsBtn">انتشار خبر</button>
        <button type="button" id="cancelNewsBtn" class="secondary">انصراف</button>
      </div>
    </form>
    <p id="newsStatus" class="status" role="status" aria-live="polite"></p>
    <div id="newsList">در حال دریافت اخبار...</div>
  </section>
</main>
<script>
(() => {
  "use strict";
  // تنظیمات پروژه Supabase
  const SUPABASE_URL = "https://tttffiyxqxphixryjavq.supabase.co";
  const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_WetuCjAtn1DCom1pOF3SKw_fxMbJdr_";
  const $ = id => document.getElementById(id);
  const authStatus = $("authStatus");
  const newsStatus = $("newsStatus");
  function setStatus(element, message) {
    element.textContent = message || "";
  }
  function show(element, visible) {
    element.classList.toggle("hidden", !visible);
  }
  // بررسی بارگذاری کتابخانه
  if (!window.supabase) {
    setStatus(
      authStatus,
      "کتابخانه Supabase بارگذاری نشده است. اتصال اینترنت و آدرس کتابخانه را بررسی کن."
    );
    setStatus(newsStatus, "اتصال برقرار نشد.");
    $("newsList").textContent = "";
    return;
  }
  if (
    !SUPABASE_URL.startsWith("https://tttffiyxqxphixryjavq.supabase.co") ||
    !SUPABASE_PUBLISHABLE_KEY.startsWith("sb_publishable_WetuCjAtn1DCom1pOF3SKw_fxMbJdr_")
  ) {
    setStatus(authStatus, "آدرس پروژه یا کلید عمومی معتبر نیست.");
    setStatus(newsStatus, "تنظیمات اتصال را بررسی کن.");
    $("newsList").textContent = "";
    return;
  }
  // ساخت اتصال
  const db = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );
  let currentUser = null;
  let isVerifiedAdmin = false;
  let editingNewsId = null;
  let authRequestRunning = false;
  let refreshVersion = 0;
  // بررسی نقش واقعی حساب در دیتابیس
  async function verifyAdmin() {
    if (!currentUser) return false;
    const { data, error } = await db
      .from("user_roles")
      .select("role")
      .eq("user_id", currentUser.id)
      .maybeSingle();
    if (error) {
      console.error("Admin verification:", error.message);
      return false;
    }
    return data?.role === "admin";
  }
  async function refreshSession() {
    const version = ++refreshVersion;
    const { data, error } = await db.auth.getUser();
    if (version !== refreshVersion) return;
    currentUser = error ? null : data.user;
    isVerifiedAdmin = await verifyAdmin();
    if (version !== refreshVersion) return;
    $("userInfo").textContent = currentUser
      ? "وارد شده‌اید: " + currentUser.email
      : "برای استفاده از حساب کاربری وارد شوید.";
    show($("logoutBtn"), !!currentUser);
    show($("showEditorBtn"), isVerifiedAdmin);
    if (!isVerifiedAdmin) {
      show($("newsForm"), false);
      editingNewsId = null;
    }
    await loadNews();
  }
  // ورود
  $("authForm").addEventListener("submit", async event => {
    event.preventDefault();
    if (authRequestRunning) return;
    authRequestRunning = true;
    const loginBtn = $("loginBtn");
    loginBtn.disabled = true;
    try {
      setStatus(authStatus, "در حال ورود...");
      const email = $("email").value.trim();
      const password = $("password").value;
      const { error } = await db.auth.signInWithPassword({
        email,
        password
      });
      if (error) {
        setStatus(authStatus, "ورود ناموفق بود: " + error.message);
        return;
      }
      setStatus(authStatus, "ورود موفق بود.");
      await refreshSession();
    } catch (error) {
      setStatus(authStatus, "خطا در ورود: " + error.message);
    } finally {
      authRequestRunning = false;
      loginBtn.disabled = false;
    }
  });
  // ثبت‌نام
  $("signupBtn").addEventListener("click", async () => {
    if (authRequestRunning) return;
    const email = $("email").value.trim();
    const password = $("password").value;
    if (!email || password.length < 6) {
      setStatus(
        authStatus,
        "ایمیل معتبر وارد کن و رمز عبور باید حداقل ۶ کاراکتر داشته باشد."
      );
      return;
    }
    authRequestRunning = true;
    $("signupBtn").disabled = true;
    try {
      setStatus(authStatus, "در حال ثبت‌نام...");
      const { data, error } = await db.auth.signUp({
        email,
        password,
        options: {
          emailRedirectTo: window.location.origin
        }
      });
      if (error) {
        setStatus(authStatus, "ثبت‌نام ناموفق بود: " + error.message);
        return;
      }
      if (data.user) {
if (data.session) {
currentUser = data.user;
await checkAdminRole();
renderAccount();
closeModal();
$(“accountForm”).reset();
setStatus(“accountStatus”, “ثبت‌نام موفق بود؛ وارد سایت شدی.”, “success”);
} else {
setStatus(
“accountStatus”,
“حسابت ساخته شد! ایمیلت را برای تأیید بررسی کن؛ بعد از تأیید، از بخش ورود وارد شو.”,
“success”
);
}
}
        setStatus(authStatus, "ثبت‌نام موفق بود؛ وارد حساب شدی.");
      } else {
        setStatus(
          authStatus,
          "درخواست ثبت‌نام انجام شد. اگر تأیید ایمیل فعال است، ایمیلت را بررسی کن."
        );
      }
      await refreshSession();
    } catch (error) {
      setStatus(authStatus, "خطا در ثبت‌نام: " + error.message);
    } finally {
      authRequestRunning = false;
      $("signupBtn").disabled = false;
    }
  });
  // خروج
  $("logoutBtn").addEventListener("click", async () => {
    const { error } = await db.auth.signOut();
    if (error) {
      setStatus(authStatus, "خروج ناموفق بود: " + error.message);
      return;
    }
    setStatus(authStatus, "از حساب خارج شدی.");
    await refreshSession();
  });
  // باز کردن فرم خبر جدید
  $("showEditorBtn").addEventListener("click", async () => {
    isVerifiedAdmin = await verifyAdmin();
    if (!isVerifiedAdmin) {
      show($("showEditorBtn"), false);
      setStatus(newsStatus, "اجازه مدیریت اخبار را نداری.");
      return;
    }
    editingNewsId = null;
    $("newsTitle").value = "";
    $("newsContent").value = "";
    $("saveNewsBtn").textContent = "انتشار خبر";
    show($("newsForm"), true);
  });
  $("cancelNewsBtn").addEventListener("click", () => {
    show($("newsForm"), false);
    editingNewsId = null;
  });
  // ذخیره یا ویرایش خبر
  $("newsForm").addEventListener("submit", async event => {
    event.preventDefault();
    isVerifiedAdmin = await verifyAdmin();
    if (!isVerifiedAdmin || !currentUser) {
      show($("newsForm"), false);
      show($("showEditorBtn"), false);
      setStatus(newsStatus, "اجازه مدیریت اخبار را نداری.");
      return;
    }
    const title = $("newsTitle").value.trim();
    const content = $("newsContent").value.trim();
    if (!title || !content) {
      setStatus(newsStatus, "عنوان و متن خبر را وارد کن.");
      return;
    }
    const saveBtn = $("saveNewsBtn");
    saveBtn.disabled = true;
    try {
      setStatus(newsStatus, "در حال ذخیره خبر...");
      let result;
      if (editingNewsId) {
        result = await db
          .from("news")
          .update({
            title,
            content,
            updated_at: new Date().toISOString()
          })
          .eq("id", editingNewsId);
      } else {
        result = await db.from("news").insert({
          title,
          content,
          author_id: currentUser.id
        });
      }
      if (result.error) {
        setStatus(newsStatus, "ذخیره ناموفق بود: " + result.error.message);
        return;
      }
      editingNewsId = null;
      show($("newsForm"), false);
      setStatus(newsStatus, "خبر با موفقیت ذخیره شد.");
      await loadNews();
    } catch (error) {
      setStatus(newsStatus, "خطا در ذخیره خبر: " + error.message);
    } finally {
      saveBtn.disabled = false;
    }
  });
  // دریافت و نمایش اخبار
  async function loadNews() {
    const list = $("newsList");
    list.textContent = "در حال دریافت اخبار...";
    const { data, error } = await db
      .from("news")
      .select("id, title, content, created_at")
      .order("created_at", { ascending: false });
    list.replaceChildren();
    if (error) {
      list.textContent = "دریافت اخبار ناموفق بود.";
      setStatus(newsStatus, "خطای دریافت اخبار: " + error.message);
      console.error("News loading:", error);
      return;
    }
    setStatus(newsStatus, "");
    if (!data || data.length === 0) {
      list.textContent = "هنوز خبری منتشر نشده است.";
      return;
    }
    data.forEach(item => {
      const article = document.createElement("article");
      article.className = "news-item";
      const heading = document.createElement("h3");
      heading.textContent = item.title;
      const body = document.createElement("p");
      body.style.whiteSpace = "pre-wrap";
      body.textContent = item.content;
      const date = document.createElement("p");
      date.className = "muted";
      date.textContent = item.created_at
        ? new Date(item.created_at).toLocaleString("fa-IR")
        : "";
      article.append(heading, body, date);
      if (isVerifiedAdmin) {
        const editBtn = document.createElement("button");
        editBtn.type = "button";
        editBtn.textContent = "ویرایش";
        editBtn.className = "secondary";
        editBtn.addEventListener("click", async () => {
          isVerifiedAdmin = await verifyAdmin();
          if (!isVerifiedAdmin) {
            show($("showEditorBtn"), false);
            return;
          }
          editingNewsId = item.id;
          $("newsTitle").value = item.title;
          $("newsContent").value = item.content;
          $("saveNewsBtn").textContent = "ذخیره تغییرات";
          show($("newsForm"), true);
          $("newsForm").scrollIntoView({ behavior: "smooth" });
        });
        const deleteBtn = document.createElement("button");
        deleteBtn.type = "button";
        deleteBtn.textContent = "حذف";
        deleteBtn.className = "danger";
        deleteBtn.addEventListener("click", async () => {
          isVerifiedAdmin = await verifyAdmin();
          if (!isVerifiedAdmin || !confirm("این خبر حذف شود؟")) {
            return;
          }
          const { error } = await db
            .from("news")
            .delete()
            .eq("id", item.id);
          if (error) {
            setStatus(newsStatus, "حذف ناموفق بود: " + error.message);
            return;
          }
          setStatus(newsStatus, "خبر حذف شد.");
          await loadNews();
        });
        article.append(editBtn, deleteBtn);
      }
      list.append(article);
    });
  }
  // هماهنگی وضعیت ورود با Supabase
  db.auth.onAuthStateChange(() => {
    setTimeout(() => {
      refreshSession();
    }, 0);
  });
  // شروع برنامه
  refreshSession();
})();
</script>
</body>
</html>
